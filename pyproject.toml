[project]
name = "clipper"
version = "0.1.0"
description = "Turn long videos into vertical Shorts with captions, hooks and posting text"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "numpy>=2",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
    "opencv-python-headless>=4.10",
    "typesafe-sdk>=0.7",
    "yt-dlp[default]>=2026.7.4",
]

[project.scripts]
clipper = "clipper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
